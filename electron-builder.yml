# Windows 패키징 (SPEC 7절 6단계): NSIS 설치판 + 포터블 exe, x64
# v1(FC CLI Viewer, appId app.fcviewer.cli)과 다른 appId → 나란히 설치된다 (SPEC 8절)
appId: app.bfclieditor.editor
productName: Betaflight CLI Editor
copyright: Copyright © 2026 클로에

directories:
  output: release
  buildResources: build

# electron-vite 빌드 결과만 담는다. React 등 UI 라이브러리는 이미 번들에 들어 있다
files:
  - out/**
  - package.json
  # serialport는 Windows x64 prebuild만 필요
  - "!node_modules/@serialport/bindings-cpp/prebuilds/!(win32-x64)/**"
  - "!node_modules/@serialport/bindings-cpp/src/**"
  - "!**/*.{md,map,ts,cc,h}"

# serialport는 N-API prebuild(win32-x64)를 그대로 쓴다 — Electron용 재빌드(node-gyp, C++ 도구 필요) 불필요
npmRebuild: false

# 네이티브 모듈(.node)은 asar 안에서 로드할 수 없다
asarUnpack:
  - "**/*.node"

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Betaflight CLI Editor
  artifactName: Betaflight-CLI-Editor-Setup-${version}.${ext}
  installerLanguages: [ko_KR]
  language: "1042"

portable:
  artifactName: Betaflight-CLI-Editor-Portable-${version}.${ext}

# .bfview.json 파일 연결은 하지 않는다 — Windows는 마지막 확장자(.json)로 연결하므로
# 모든 .json 파일을 이 앱이 가져가게 된다. 앱은 실행 인자로 받은 파일을 열 수 있게 준비되어 있다.

publish: null
